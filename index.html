<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Connexion</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Tangerine:wght@700&family=Cinzel:wght@500;600;700&family=Cormorant+Garamond:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#2c1e0f;
    --emerald:#0f6b45;
    --emerald-deep:#0a4a30;
    --paper:#ddc4a0;
    --panel:#f2e6ce;
    --line:#b98d5e;
    --accent:#0f6b45;
    --accent-2:#7a4e24;
    --error:#8c3b1b;
    --muted:#7a6449;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    background:
      radial-gradient(ellipse 80% 60% at 50% 0%, rgba(15,107,69,0.08), transparent 60%),
      radial-gradient(ellipse 70% 60% at 100% 100%, rgba(122,78,36,0.15), transparent 60%),
      var(--paper);
    color:var(--ink);
    font-family:'Cormorant Garamond',serif;
    display:flex;
    align-items:center;
    justify-content:center;
    min-height:100vh;
    padding:24px;
  }
  .scene{
    position:relative;
    width:100%;
    max-width:420px;
  }
  .eyebrow{
    font-family:'Cinzel',serif;
    font-size:11px;
    letter-spacing:0.22em;
    text-transform:uppercase;
    color:var(--accent-2);
    margin:0 0 10px 2px;
    font-weight:600;
    display:flex;
    align-items:center;
    gap:8px;
  }
  .eyebrow::before{
    content:"✦";
    color:var(--emerald);
    font-size:12px;
  }
  .eyebrow::after{
    content:"✦";
    color:var(--emerald);
    font-size:12px;
  }
  .card{
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:6px;
    padding:44px 38px 38px;
    box-shadow:0 8px 30px rgba(44,30,15,0.18), inset 0 0 0 1px rgba(15,107,69,0.06);
    position:relative;
    overflow:hidden;
  }
  .card::before{
    content:"";
    position:absolute;
    top:0; left:0;
    width:100%;
    height:3px;
    background:linear-gradient(90deg,var(--emerald-deep) 0%,var(--emerald) 50%,var(--accent-2) 100%);
  }
  .card::after{
    content:"";
    position:absolute;
    inset:10px;
    border:1px solid rgba(15,107,69,0.15);
    border-radius:3px;
    pointer-events:none;
  }
  h1{
    font-family:'Tangerine',cursive;
    font-size:56px;
    font-weight:700;
    margin:0 0 2px;
    letter-spacing:0.01em;
    color:var(--emerald-deep);
    line-height:1;
    text-shadow:0 1px 12px rgba(15,107,69,0.25);
  }
  .flourish{
    display:block;
    width:120px;
    height:16px;
    margin:6px 0 18px;
    opacity:0.7;
  }
  .flourish path{
    fill:none;
    stroke:var(--accent-2);
    stroke-width:1.4;
    stroke-linecap:round;
  }
  .sub{
    color:var(--muted);
    font-size:15px;
    margin:0 0 30px;
    line-height:1.5;
    font-style:italic;
  }
  form{display:flex;flex-direction:column;gap:16px;}
  label{
    font-family:'Cinzel',serif;
    font-size:10px;
    letter-spacing:0.08em;
    text-transform:uppercase;
    font-weight:600;
    color:var(--accent-2);
    display:block;
    margin-bottom:7px;
  }
  input[type=text],input[type=email],input[type=password]{
    width:100%;
    padding:11px 12px;
    border:1px solid var(--line);
    border-radius:3px;
    font-family:'Cormorant Garamond',serif;
    font-size:16px;
    background:rgba(255,255,255,0.5);
    color:var(--ink);
    transition:border-color .15s ease, box-shadow .15s ease;
  }
  input:focus{
    outline:none;
    border-color:var(--emerald);
    box-shadow:0 0 0 3px rgba(15,107,69,0.15);
  }
  button{
    font-family:'Cinzel',serif;
    font-weight:600;
    font-size:13px;
    letter-spacing:0.04em;
    border:none;
    border-radius:3px;
    padding:13px 16px;
    cursor:pointer;
    transition:transform .1s ease, opacity .15s ease, background .15s ease;
  }
  button:active{transform:translateY(1px);}
  .btn-primary{
    background:linear-gradient(180deg,var(--emerald) 0%,var(--emerald-deep) 100%);
    color:#f2e6ce;
    margin-top:4px;
    box-shadow:0 2px 8px rgba(10,74,48,0.35);
  }
  .btn-primary:hover{opacity:0.92;}
  .btn-secondary{
    background:transparent;
    color:var(--accent-2);
    border:1px solid var(--line);
  }
  .btn-secondary:hover{border-color:var(--accent-2);background:rgba(122,78,36,0.06);}
  .divider{
    display:flex;
    align-items:center;
    gap:12px;
    margin:24px 0 8px;
    color:var(--muted);
    font-size:12px;
    font-family:'Cinzel',serif;
    letter-spacing:0.08em;
  }
  .divider::before,.divider::after{
    content:"";
    flex:1;
    height:1px;
    background:var(--line);
  }
  .google-btn{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:10px;
  }
  .google-icon{width:16px;height:16px;flex-shrink:0;}
  .row-links{
    display:flex;
    justify-content:space-between;
    margin-top:20px;
    font-size:13px;
  }
  .row-links a, .row-links button.link{
    color:var(--emerald-deep);
    text-decoration:none;
    background:none;
    border:none;
    padding:0;
    font-family:'Cormorant Garamond',serif;
    font-size:14px;
    font-style:italic;
    cursor:pointer;
  }
  .row-links a:hover, .row-links button.link:hover{text-decoration:underline;}
  #status{
    min-height:20px;
    font-size:13px;
    margin-top:4px;
    line-height:1.5;
  }
  #status.error{color:var(--error);}
  #status.ok{color:var(--emerald-deep);}
  #userbox{
    display:none;
    text-align:center;
  }
  #userbox p{font-size:15px;color:var(--muted);margin:0 0 18px;font-style:italic;}
  #userbox strong{color:var(--emerald-deep);font-style:normal;}
  .config-warning{
    margin-top:16px;
    font-size:12px;
    color:var(--muted);
    text-align:center;
  }
</style>
</head>
<body>
<div class="scene">
  <p class="eyebrow">Sanctuaire d'accès</p>
  <div class="card">

    <div id="authbox">
      <h1>Connexion</h1>
      <p class="sub">Entrez vos identifiants pour accéder à votre compte.</p>

      <form id="login-form">
        <div>
          <label for="username">Nom d'agent</label>
          <input type="text" id="username" required autocomplete="username" placeholder="votre-nom-d-agent">
        </div>
        <div>
          <label for="password">Mot de passe</label>
          <input type="password" id="password" required autocomplete="current-password" placeholder="••••••••">
        </div>
        <button type="submit" class="btn-primary">Se connecter</button>
      </form>

      <div id="status"></div>

      <div class="row-links" style="justify-content:center;">
        <button type="button" class="link" id="toggle-mode">Créer un compte</button>
      </div>

      <p class="config-warning" id="config-warning" style="display:none;">
        ⚠️ Configuration Firebase manquante — voir <code>firebaseConfig</code> dans le code source.
      </p>
    </div>

    <div id="userbox">
      <h1>Bienvenue</h1>
      <svg class="flourish" viewBox="0 0 120 16" xmlns="http://www.w3.org/2000/svg" style="margin-left:auto;margin-right:auto;">
        <path d="M2 8 C 20 -2, 30 18, 48 8 C 60 1, 66 1, 72 8 C 80 17, 92 -2, 106 8 C 112 12, 115 8, 118 8"/>
      </svg>
      <p>Connecté en tant que <strong id="user-email"></strong></p>
      <button id="logout-btn" class="btn-secondary" style="width:100%;">Se déconnecter</button>
    </div>

  </div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js";
  import {
    getAuth,
    signInWithEmailAndPassword,
    createUserWithEmailAndPassword,
    updateProfile,
    onAuthStateChanged,
    signOut
  } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-auth.js";

  // ----------------------------------------------------------------
  // 1) Remplacez ces valeurs par celles de VOTRE projet Firebase.
  //    Console Firebase > Paramètres du projet > Vos applications > Config SDK
  // ----------------------------------------------------------------
  const firebaseConfig = {
    apiKey: "AIzaSyDDZI33eQttXHo1CPSLzx_61AYuivVMB_o",
    authDomain: "le-tableau-d-action.firebaseapp.com",
    projectId: "le-tableau-d-action",
    storageBucket: "le-tableau-d-action.firebasestorage.app",
    messagingSenderId: "120615573034",
    appId: "1:120615573034:web:7a26169618cf5a04659553"
  };

  const isConfigured = !Object.values(firebaseConfig).some(v => v.startsWith("VOTRE_"));
  if (!isConfigured) {
    document.getElementById('config-warning').style.display = 'block';
  }

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);

  // Firebase Authentication exige un e-mail en interne : on fabrique donc
  // une adresse technique invisible à partir du nom d'utilisateur choisi.
  const PSEUDO_DOMAIN = "le-tableau-daction.local";
  function usernameToEmail(username){
    const clean = username.trim().toLowerCase().replace(/[^a-z0-9._-]/g, '.');
    return `${clean}@${PSEUDO_DOMAIN}`;
  }

  const statusEl = document.getElementById('status');
  const authbox = document.getElementById('authbox');
  const userbox = document.getElementById('userbox');
  const userEmailEl = document.getElementById('user-email');
  const form = document.getElementById('login-form');
  const toggleBtn = document.getElementById('toggle-mode');
  const submitBtn = form.querySelector('button[type=submit]');

  let mode = 'login'; // ou 'signup'

  function setStatus(message, type){
    statusEl.textContent = message || '';
    statusEl.className = type || '';
  }

  function friendlyError(err){
    const map = {
      'auth/invalid-email': "Nom d'agent invalide.",
      'auth/user-not-found': "Aucun compte ne correspond à ce nom d'agent.",
      'auth/wrong-password': "Mot de passe incorrect.",
      'auth/email-already-in-use': "Ce nom d'agent est déjà pris.",
      'auth/weak-password': "Le mot de passe doit contenir au moins 6 caractères.",
      'auth/invalid-credential': "Identifiants invalides.",
      'auth/too-many-requests': "Trop de tentatives. Réessayez plus tard.",
    };
    return map[err.code] || "Une erreur est survenue. " + err.message;
  }

  toggleBtn.addEventListener('click', () => {
    mode = mode === 'login' ? 'signup' : 'login';
    submitBtn.textContent = mode === 'login' ? 'Se connecter' : 'Créer le compte';
    toggleBtn.textContent = mode === 'login' ? 'Créer un compte' : 'J’ai déjà un compte';
    setStatus('');
  });

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    const username = document.getElementById('username').value.trim();
    const password = document.getElementById('password').value;
    const technicalEmail = usernameToEmail(username);
    setStatus('Veuillez patienter…');
    try {
      if (mode === 'login') {
        await signInWithEmailAndPassword(auth, technicalEmail, password);
      } else {
        const cred = await createUserWithEmailAndPassword(auth, technicalEmail, password);
        await updateProfile(cred.user, { displayName: username });
      }
      setStatus('');
    } catch (err) {
      setStatus(friendlyError(err), 'error');
    }
  });

  document.getElementById('logout-btn').addEventListener('click', async () => {
    await signOut(auth);
  });

  onAuthStateChanged(auth, (user) => {
    if (user) {
      window.location.href = 'tableau-de-travail.html';
    } else {
      authbox.style.display = 'block';
      userbox.style.display = 'none';
    }
  });
</script>
</body>
</html>
